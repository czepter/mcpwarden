name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Schema und Migrationen passen zum Stand
        run: |
          pnpm db:schema
          pnpm db:generate
          pnpm db:check
          git diff --exit-code
          test -z "$(git status --porcelain server/db)"
      - run: sh scripts/test-init-env.sh
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_BACKEND: ${{ matrix.backend }}
      TEST_PG_ADMIN_URL: postgres://postgres:test@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-supervisor.mjs
      # test:int enthaelt Vertrags-Test (echte Antworten gegen die zod-Schemas) und Full-Stack-Smoke als Vitest-Suite
      - run: pnpm test:int
      # derselbe Smoke als Skript gegen eine frische Instanz des gebauten Artefakts (PGlite bzw. Postgres je Matrix-Eintrag)
      - name: Full-Stack-Smoke (Skript)
        run: pnpm smoke

  # Supervisor im Linux-Container (UID-Wechsel, nur SETUID/SETGID/CHOWN, `id -G`, Härtung); Docker ist auf dem Runner vorhanden
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-supervisor.mjs
      - run: pnpm test:container

  # Beispiel-Compose (Ziel full) baut und startet frisch: Full-Stack-Smoke (Registrierung, Einladung, PAT, OAuth+PKCE, /mcp über Fake-Upstream,
  # Isolation, Widerruf), Neustart, sauberes Ende
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compose
