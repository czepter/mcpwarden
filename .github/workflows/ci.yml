name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Schema and migrations match the state
        run: |
          pnpm db:schema
          pnpm db:generate
          pnpm db:check
          git diff --exit-code
          test -z "$(git status --porcelain server/db)"
      - run: sh scripts/test-init-env.sh
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_BACKEND: ${{ matrix.backend }}
      TEST_PG_ADMIN_URL: postgres://postgres:test@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-supervisor.mjs
      # test:int contains the contract test (real responses against the zod schemas) and the full-stack smoke as a Vitest suite
      - run: pnpm test:int
      # the same smoke as a script against a fresh instance of the built artifact (PGlite or Postgres per matrix entry)
      - name: Full-stack smoke (script)
        run: pnpm smoke

  # Supervisor in a Linux container (UID switch, only SETUID/SETGID/CHOWN, `id -G`, hardening); Docker is available on the runner
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-supervisor.mjs
      - run: pnpm test:container

  # Example compose (target full) builds and starts fresh: full-stack smoke (registration, invitation, PAT, OAuth+PKCE, /mcp via fake upstream,
  # isolation, revocation), restart, clean shutdown
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compose

  # Target slim (web app only): builds, starts without capabilities, stdio is fixed off (image_slim)
  slim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/e2e/slim-smoke.sh
