name: ci
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - ".github/workflows/image.yml"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - ".github/workflows/image.yml"
      - ".gitignore"
      - ".dockerignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

run-name: ci · tree ${{ github.event.head_commit.tree_id || github.sha }}

jobs:
  # Skip when this exact content (git tree) already passed: a merge or pull of tested content does not run again.
  # Same-repo PRs are skipped too, because the push to their branch already ran.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          TREE: ${{ github.event.head_commit.tree_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          skip=false
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            skip=true
          elif [ "$EVENT" = push ] && [ -n "$TREE" ]; then
            hits=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --status success --limit 100 \
              --json displayTitle --jq "[.[] | select(.displayTitle | contains(\"tree $TREE\"))] | length")
            [ "${hits:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip (event=$EVENT tree=$TREE)"

  check:
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Schema and migrations match the state
        run: |
          pnpm db:schema
          pnpm db:generate
          pnpm db:check
          git diff --exit-code
          test -z "$(git status --porcelain server/db)"
      - run: sh scripts/test-init-env.sh
      - run: pnpm test:unit
      - run: pnpm ui:test
      - run: pnpm build
      - run: pnpm ui:check-build

  integration:
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_BACKEND: ${{ matrix.backend }}
      TEST_PG_ADMIN_URL: postgres://postgres:test@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-supervisor.mjs
      # test:int contains the contract test (real responses against the zod schemas) and the full-stack smoke as a Vitest suite
      - run: pnpm test:int
      # the same smoke as a script against a fresh instance of the built artifact (PGlite or Postgres per matrix entry)
      - name: Full-stack smoke (script)
        run: pnpm smoke

  # Supervisor in a Linux container (UID switch, only SETUID/SETGID/CHOWN, `id -G`, hardening); Docker is available on the runner
  container:
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-supervisor.mjs
      - run: pnpm test:container
