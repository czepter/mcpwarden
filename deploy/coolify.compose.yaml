services:
  mcpwarden:
    image: ghcr.io/czepter/mcpwarden:${MCPWARDEN_TAG:-latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICE_FQDN_MCPWARDEN_3000
      - BASE_URL=${SERVICE_URL_MCPWARDEN_3000}
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_AUTHSECRET}
      - MASTER_KEY=${SERVICE_HEX_64_MASTERKEY}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - STDIO_MODE=${STDIO_MODE:-auto}
      - DATABASE_URL=${DATABASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_NOTIFY_WINDOW_MIN=${MAIL_NOTIFY_WINDOW_MIN:-}
    volumes:
      - mcpwarden-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  mcpwarden-data:
